# Apache配置 - 多项目管理
# 更新时间: 2026-04-10
# 新服务器: 8.159.129.205 / newyobo.top
# 
# 使用方法:
# 1. 复制到 /etc/apache2/sites-available/newyobo.conf
# 2. a2ensite newyobo
# 3. a2enmod proxy proxy_http ssl rewrite headers
# 4. systemctl reload apache2

# HTTP 重定向到 HTTPS
<VirtualHost *:80>
    ServerName newyobo.top
    ServerAlias www.newyobo.top weeklycheck.newyobo.top
    
    # ACME验证路径（Let's Encrypt证书申请用）
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Options None
        AllowOverride None
        Require all granted
    </Directory>
    
    # 其他请求重定向到HTTPS
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>

# 主域名 newyobo.top (HTTPS)
<VirtualHost *:443>
    ServerName newyobo.top
    ServerAlias www.newyobo.top
    
    # SSL证书路径（用certbot申请后填充）
    # SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/newyobo.top/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/newyobo.top/privkey.pem
    
    # 日志
    ErrorLog ${APACHE_LOG_DIR}/newyobo_error.log
    CustomLog ${APACHE_LOG_DIR}/newyobo_access.log combined
    
    # 门店评级系统 - 代理到8001端口
    ProxyPreserveHost On
    ProxyPass /rating http://127.0.0.1:8001/rating
    ProxyPassReverse /rating http://127.0.0.1:8001/rating
    ProxyPass /api/rating http://127.0.0.1:8001/api/rating
    ProxyPassReverse /api/rating http://127.0.0.1:8001/api/rating
    
    # 评级系统静态文件
    Alias /static/ /var/www/review-result-viewer/viewer/static/
    <Directory /var/www/review-result-viewer/viewer/static/>
        Require all granted
        Options -Indexes
        <FilesMatch "\.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$">
            Header set Cache-Control "public, max-age=604800, immutable"
        </FilesMatch>
    </Directory>
    
    # approvalquery 项目
    Alias /approvalquerynew /var/www/approval-viewer/approvalquery
    <Directory /var/www/approval-viewer/approvalquery>
        Require all granted
        Options -Indexes
        <FilesMatch "\.(json|txt|csv|xlsx)$">
            Header set Cache-Control "no-store, no-cache, must-revalidate"
            Header set Access-Control-Allow-Origin "*"
        </FilesMatch>
    </Directory>
    
    # 根路径提示
    <Location />
        Require all granted
    </Location>
    
    DocumentRoot /var/www/html
    DirectoryIndex index.html
</VirtualHost>

# 周清审核系统（子域名）
<VirtualHost *:443>
    ServerName weeklycheck.newyobo.top
    
    # SSL证书路径（用certbot申请后填充）
    # SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/weeklycheck.newyobo.top/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/weeklycheck.newyobo.top/privkey.pem
    
    # 日志
    ErrorLog ${APACHE_LOG_DIR}/weeklycheck_error.log
    CustomLog ${APACHE_LOG_DIR}/weeklycheck_access.log combined
    
    # 代理到后端8000端口
    ProxyPreserveHost On
    ProxyPass /static/ !
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/
    
    # 禁用代理缓存
    <Location />
        Header set Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
        Header set Pragma "no-cache"
    </Location>
    
    # 静态文件 - 禁用缓存
    Alias /static/ /var/www/nyb_weekly_check_tool_1.0/viewer/static/
    <Directory /var/www/nyb_weekly_check_tool_1.0/viewer/static/>
        Require all granted
        Options -Indexes
        Header set Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0"
        Header set Pragma "no-cache"
        Header set Access-Control-Allow-Origin "*"
    </Directory>
</VirtualHost>
