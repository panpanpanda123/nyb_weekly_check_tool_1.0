# nginx配置 - 多项目管理
# 更新时间: 2026-04-10
# 新服务器: 8.159.129.205 / newyobo.top

# HTTP 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name newyobo.top www.newyobo.top weeklycheck.newyobo.top;
    
    # ACME验证路径（Let's Encrypt证书申请用）
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }
    
    # 其他请求重定向到HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# 主域名 newyobo.top
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name newyobo.top www.newyobo.top 8.159.129.205;
    
    # SSL证书路径（用certbot申请后会自动填充）
    # ssl_certificate /etc/letsencrypt/live/newyobo.top/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/newyobo.top/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # 日志
    access_log /var/log/nginx/newyobo_access.log;
    error_log /var/log/nginx/newyobo_error.log;
    
    # 门店评级系统（优先匹配）
    location /rating {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    location /api/rating {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # 评级系统静态文件
    location /static/ {
        alias /var/www/review-result-viewer/viewer/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
    
    # approvalquery 项目
    location /approvalquerynew {
        alias /var/www/approval-viewer/approvalquery;
        index index.html index.htm;
        try_files $uri $uri/ /approvalquerynew/index.html;
        
        location ~ \.(json|txt|csv|xlsx)$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header Access-Control-Allow-Origin "*";
        }
        
        location ~ \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
    
    # 根路径
    location = / {
        return 200 "可用项目:\n- /rating (门店评级)\n- /approvalquery (审批查询)\n- weeklycheck.newyobo.top (周清审核)\n";
        add_header Content-Type text/plain;
    }
    
    # 其他路径返回404
    location / {
        return 404;
    }
}

# 周清审核系统（子域名）
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name weeklycheck.newyobo.top;
    
    # SSL证书路径（用certbot申请后会自动填充）
    # ssl_certificate /etc/letsencrypt/live/weeklycheck.newyobo.top/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/weeklycheck.newyobo.top/privkey.pem;
    # 或者用通配符证书:
    # ssl_certificate /etc/letsencrypt/live/newyobo.top/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/newyobo.top/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    
    # 日志
    access_log /var/log/nginx/weeklycheck_access.log;
    error_log /var/log/nginx/weeklycheck_error.log;
    
    # ACME验证路径
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }
    
    # 根路径代理到后端8000端口 - 禁用缓存
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;
        
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Last-Modified $date_gmt;
    }
    
    # API路径代理 - 禁用缓存
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }
    
    # 静态文件路径 - 禁用缓存
    location /static/ {
        alias /var/www/nyb_weekly_check_tool_1.0/viewer/static/;
        
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Last-Modified $date_gmt;
        add_header ETag "";
        if_modified_since off;
        add_header Access-Control-Allow-Origin "*";
    }
}
