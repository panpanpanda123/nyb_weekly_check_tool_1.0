# nginx配置 - newyobo 新服务器
# 更新时间: 2026-04-10
# 服务器: 8.159.129.205
# 监听8080端口，不使用SSL

server {
    listen 8080;
    server_name 8.159.129.205 newyobo.top weeklycheck.newyobo.top _;

    # 日志
    access_log /var/log/nginx/newyobo_access.log;
    error_log /var/log/nginx/newyobo_error.log;

    # 根路径 + 所有页面 -> 代理到 gunicorn 8000
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 30s;

        # 禁用缓存
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    # API路径
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
    }

    # 静态文件 - 禁用缓存
    location /static/ {
        alias /var/www/nyb_weekly_check_tool_1.0/viewer/static/;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Access-Control-Allow-Origin "*";
    }
}
